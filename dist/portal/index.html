<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direct Line · Client Portal</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/p/common.css?v=2">
</head>
<body>
<div class="empty" id="boot">Loading…</div>
<div id="app" hidden>
  <header class="topbar">
    <a class="brand" href="/portal/">direct<b>↗</b>line.<small>CLIENT PORTAL</small></a>
    <span class="spacer"></span>
    <div class="who"><strong data-name></strong><span data-username></span></div>
    <button class="btn btn-ghost btn-small" type="button" data-logout>Log out</button>
  </header>
  <main>
    <h1>Your orders</h1>
    <p class="sub">Add each order with its tracking number, what it costs you and what you sold it for. Your profit is worked out for you.</p>

    <section class="cards" data-summary></section>

    <div class="grid-2">
      <section class="panel" id="order-panel">
        <div class="panel-head"><h2 data-form-title>Add an order</h2><button class="btn btn-small" type="button" data-cancel-edit hidden>Cancel edit</button></div>
        <form class="form" id="order-form" novalidate>
          <label class="field">Order number / reference<input name="orderRef" maxlength="120" placeholder="e.g. Etsy #3412"></label>
          <label class="field">Tracking number<input name="trackingNumber" maxlength="120" placeholder="e.g. LX123456789CN"></label>
          <label class="field">Destination<select name="destination"></select></label>
          <label class="field">Product type<select name="category"></select></label>
          <label class="field">Weight (kg)<input name="weightKg" type="number" min="0" step="0.01" inputmode="decimal"></label>
          <label class="field">Price — what you pay us (USD)<input name="price" type="number" min="0" step="0.01" inputmode="decimal" required></label>
          <label class="field">Selling price — what your customer paid (USD)<input name="sellingPrice" type="number" min="0" step="0.01" inputmode="decimal"></label>
          <div class="field" style="justify-content:flex-end"><span class="profit-preview" data-profit>Profit: —</span></div>
          <label class="field full">Notes<textarea name="notes" maxlength="2000" placeholder="Anything we should know about this order"></textarea></label>
          <div class="form-actions">
            <button class="btn btn-gold" type="submit" data-submit>Add order</button>
            <button class="btn" type="button" data-fill-quote title="Fill the price with the shipping quote for this destination, type and weight">Fill price from shipping quote</button>
            <p class="msg" data-form-msg></p>
          </div>
        </form>
      </section>
      <section class="panel" id="calculator"></section>
    </div>

    <section class="panel">
      <div class="panel-head"><h2>All orders</h2><div class="toolbar"><input type="search" placeholder="Search tracking, order #, notes…" data-search></div></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Order</th><th>Tracking</th><th>To</th><th class="num">Price</th><th class="num">Sold for</th><th class="num">Profit</th><th>Status</th><th>Notes</th><th></th></tr></thead>
        <tbody data-orders></tbody>
      </table></div>
    </section>
  </main>
</div>
<script src="/p/login-extras.js?v=1"></script>
<script src="/p/common.js?v=2"></script>
<script src="/portal/portal.js?v=2"></script>
</body>
</html>
