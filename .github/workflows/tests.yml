name: Tests

# Runs on every pull request and on every push to main.
#   unit:   the screen files are built into dist/, and the unit tests (tests/*.test.mjs) pass
#   checks: the behaviour checks (checks/*.mjs): real database code on an in-memory Postgres, a fake Google Sheet,
#           and the real admin / client screens in Chrome, in English and Hebrew, desktop and phone
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # The behaviour checks in 4 groups side by side, balanced by run time (17 Nov 2026: in one line they took ~25 minutes).
  checks:
    name: checks (${{ matrix.group }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium for the screen checks
        run: npx playwright-core install --with-deps chromium
      - name: Behaviour and screen checks, group ${{ matrix.group }} of 4
        run: node scripts/run-checks.mjs --group=${{ matrix.group }}/4
        env:
          CHECKS_OUT: ${{ runner.temp }}/checks
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-screenshots-${{ matrix.group }}
          path: ${{ runner.temp }}/checks
          if-no-files-found: ignore
          retention-days: 7
